version: "3.9"

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: ${NODE_ENV}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID_DEFAULT: ${TELEGRAM_CHAT_ID_DEFAULT}
      TELEGRAM_CHAT_ID_MAP: ${TELEGRAM_CHAT_ID_MAP}
    ports:
      - "${API_PORT}:${API_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.API_PORT || '8000') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      INGESTION_POLL_INTERVAL_MS: ${INGESTION_POLL_INTERVAL_MS}
      ORCHESTRATION_LOCK_KEY: ${ORCHESTRATION_LOCK_KEY}
      INGESTION_MODE: ${INGESTION_MODE}
      INGESTION_FIXTURE_FILE: ${INGESTION_FIXTURE_FILE}
      SCRAPLING_PYTHON_BIN: ${SCRAPLING_PYTHON_BIN}
      SCRAPLING_SCRIPT_PATH: ${SCRAPLING_SCRIPT_PATH}
      SCRAPLING_TARGET_URL: ${SCRAPLING_TARGET_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID_DEFAULT: ${TELEGRAM_CHAT_ID_DEFAULT}
      TELEGRAM_CHAT_ID_MAP: ${TELEGRAM_CHAT_ID_MAP}

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
